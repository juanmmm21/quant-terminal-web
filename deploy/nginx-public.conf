# Public, read-only surface: the /public page and GET /api/v1/public/*. Nothing else from the
# API is reachable through this server (no controls, no tokens, no devices).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:" always;

    location = / { return 302 /public; }
    location = /public { try_files /index.html =404; }
    location /assets/ { try_files $uri =404; expires 7d; }

    location /api/v1/public/ {
        limit_except GET { deny all; }
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }
    location = /api/v1/health { limit_except GET { deny all; } proxy_pass http://api:8000; }

    location / { return 404; }
}
